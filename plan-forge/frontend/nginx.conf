server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 10m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Proxy API calls to the backend container.
    # The `resolver` + variable-based `proxy_pass` pattern forces nginx to
    # re-resolve "backend" via the container DNS (127.0.0.11 on both Docker
    # and Podman 4+) every `valid=10s`. Without it, nginx resolves "backend"
    # once at startup and caches the IP forever — so any backend container
    # rebuild leaves nginx dialing a dead IP and serving 502 Bad Gateway
    # until the frontend container is also restarted.
    location /api/ {
        resolver __DNS_RESOLVER__ valid=10s ipv6=off;
        set $upstream_backend "backend:4000";
        proxy_pass http://$upstream_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # SPA fallback. index.html and app.js change on every deploy, so they
    # must revalidate with the server every load — otherwise users keep seeing
    # the pre-deploy version until they hard-refresh.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri =404;
    }
    location = /app.js {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache only the truly static assets aggressively.
    location ~* \.(css|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }
}
