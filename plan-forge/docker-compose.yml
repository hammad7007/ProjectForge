services:
  db:
    # pgvector image is Postgres 16 with the `vector` extension pre-installed.
    # Used by the RAG layer to store + retrieve artifact embeddings (see
    # backend/src/embeddings.js and backend/src/agents.js).
    image: pgvector/pgvector:pg16
    container_name: planforge-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: planforge
      POSTGRES_PASSWORD: planforge_dev_pw
      POSTGRES_DB: planforge
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U planforge -d planforge"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - forgenet

  backend:
    build: ./backend
    container_name: planforge-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://planforge:planforge_dev_pw@db:5432/planforge
      JWT_SECRET: ${JWT_SECRET:-dev-change-me-in-prod-please}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      PORT: "4000"
      NODE_ENV: production
      # USE_AGENTS=true runs the 5-agent LangGraph pipeline
      # (Retriever→Planner→Drafter→Critic→Refiner) for every generation.
      # Set to false to fall back to a single-call generation per artifact.
      USE_AGENTS: ${USE_AGENTS:-true}
      # Cache the local embedding model (all-MiniLM-L6-v2, ~25 MB) so we
      # don't re-download it on every container start.
      TRANSFORMERS_CACHE: /root/.cache/transformers
      HF_HOME: /root/.cache/huggingface
    volumes:
      # Persist Claude CLI auth (~/.claude, ~/.claude.json) AND the local
      # transformers model cache (~/.cache) across rebuilds so embeddings
      # initialise instantly on subsequent boots.
      - claude_home:/root
    depends_on:
      db:
        condition: service_healthy
    networks:
      - forgenet

  frontend:
    build: ./frontend
    container_name: planforge-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - forgenet

volumes:
  pgdata:
  claude_home:

networks:
  forgenet:
    driver: bridge
